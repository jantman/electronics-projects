; =============================================================
;  SEN-39002 Lightning Emulator driver -- ESP32
; =============================================================
; Bench-test driver for the Playing With Fusion SEN-39002 emulator
; shield, used to exercise the AS3935 detector through to Home
; Assistant. See src/main.cpp for wiring and theory of operation.
;
;   pio run                       compile
;   pio run -t upload             compile + flash
;   pio device monitor            serial console
;   pio run -t upload -t monitor  all three
;
; This is a standalone PlatformIO project and is deliberately NOT
; part of the ESPHome build for the detector itself -- the emulator
; runs on a second, separate ESP32 so the test stimulus stays
; independent of the device under test.
; =============================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; No external libraries: the two MCP4725 operations used are inlined
; in main.cpp, so PWFusion_MCP4725 is not needed.
lib_deps =

monitor_speed = 115200

; The monitor sends keystrokes immediately, which is what the single
; character commands (f/m/c/a/+/-/?) expect -- just press the key, no
; Enter needed. Do not add the send_on_enter filter.
monitor_filters =
    time
    esp32_exception_decoder

build_flags =
    -Wall
    -Wextra

; Port is auto-detected. Uncomment and set if you have several boards
; attached, or run `pio device list` to see what is present.
; upload_port = /dev/ttyUSB0
; monitor_port = /dev/ttyUSB0

; Default upload speed is 460800. Drop to 115200 if flashing is flaky
; on a long or cheap USB cable.
; upload_speed = 115200
