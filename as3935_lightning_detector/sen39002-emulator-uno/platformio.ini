; =============================================================
;  SEN-39002 Lightning Emulator driver -- Arduino Uno R3
; =============================================================
; Bench-test driver for the Playing With Fusion SEN-39002 emulator
; shield, used to exercise the AS3935 detector through to Home
; Assistant. The shield is an Arduino shield: it stacks directly on
; the Uno, no jumpers. See src/main.cpp for theory of operation.
;
;   pio run                       compile
;   pio run -t upload             compile + flash
;   pio device monitor            serial console
;   pio run -t upload -t monitor  all three
;
; This is a standalone PlatformIO project and is deliberately NOT part
; of the ESPHome build for the detector itself -- the emulator runs on
; its own board so the test stimulus stays independent of the device
; under test.
; =============================================================

[env:uno]
platform = atmelavr
board = uno
framework = arduino

; PWFusion's own MCP4725 library, used UNMODIFIED and on purpose.
;
; It has a real bug -- setOutput() writes the low data nibble
; right-justified when the MCP4725 "Write DAC Register" format wants it
; in the upper nibble, so the bottom 4 bits of every value are dropped
; (see the DAC RESOLUTION note in src/main.cpp). Do not "fix" it and do
; not swap in a different MCP4725 library: PWFusion calibrated the decay
; profile and the published 4-10 cm working range against this exact
; behavior. Replacing it changes the stimulus.
;
; Pinned to a commit so the calibrated stack cannot shift underneath us.
lib_deps =
    https://github.com/PlayingWithFusion/PWFusion_MCP4725.git#3054ba7870f4aa2893b8300501f9c350ac7dbc89

monitor_speed = 115200

; The monitor sends keystrokes immediately, which is what the single
; character commands (f/m/c/a/?) expect -- just press the key, no Enter
; needed. Do not add the send_on_enter filter.
monitor_filters =
    time

build_flags =
    -Wall
    -Wextra

; Port is auto-detected. Uncomment and set if you have several boards
; attached, or run `pio device list` to see what is present.
; upload_port = /dev/ttyACM0
; monitor_port = /dev/ttyACM0
