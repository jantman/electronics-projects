# Board: ESP32 DevKit V1 (Espressif)
# Definition: definitions/boards/esp32-devkit-v1/manifest.yaml
# =============================================================
#  AS3935 Lightning Detector
#  Playing With Fusion SEN-39003  +  ESP32  (SPI, IRQ-driven)
# =============================================================
# Per-strike reporting: each IRQ fires the "Storm Alert" binary
# sensor and updates the distance + energy sensors immediately.
#
# Wiring (SEN-39003 -> ESP32):
#   VDD  -> 3V3     (power at 3.3 V, NOT 5 V, to match logic levels)
#   GND  -> GND
#   SCLK -> GPIO19
#   MISO -> GPIO5
#   MOSI -> GPIO18
#   CS   -> GPIO16
#   IRQ  -> GPIO4
#   (NOT the VSPI defaults -- see the spi: block below)
#   SI   -> GND     (GND selects SPI; VDD would select I2C)
# =============================================================

esphome:
  name: esp32-lightning-sensor
  friendly_name: esp32-lightning-sensor

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# VERBOSE, not VERY_VERBOSE -- VERBOSE is the level this project actually
# needs. Everything read here is ESP_LOGV, which IS verbose: the as3935
# INT_NH / INT_D / INT_L lines, as3935_spi's read_register_, the
# "Setting tune cap to 72 pF" line emitted from setup() (README 12.1), and the
# "'Lightning Distance' >> 63.0 km" publishes that tools/ambient-survey.py
# regexes on. Only ESP_LOGVV call sites -- api and scheduler chatter, none of
# it about the sensor -- are lost. That chatter is what pushed loop() to
# ~17 log lines/s and stretched the Storm Alert pulse from its intended 10 ms
# to a measured 79 ms (README 8.4), so dropping it is a gain, not a trade.
# README 12.1 says this check "requires VERY_VERBOSE"; that is overstated.
logger:
  level: VERBOSE

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key
  # BENCH SETTING -- restore the default before deployment.
  # The default is 15min, and it counts from the last *client* connection. On
  # the bench, watching over serial with Home Assistant not connected to this
  # node, that timer always expires: the node reboots every 15 minutes and
  # silently truncates anything longer, including the hour-long surveys that
  # README 15 Phase 2 is built on. The failure is quiet -- a survey just ends.
  # 0s disables the reboot. In the attic the default is what you want, since a
  # node that has genuinely lost HA should restart.
  reboot_timeout: 0s

ota:
  password: !secret ota_password
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: !secret domain_name
  # BENCH SETTING -- was 1min, which is short enough that a brief AP hiccup
  # restarts the node in the middle of a measurement. 15min is the ESPHome
  # default, restated explicitly so the value reads as a decision rather than
  # an omission. Same reasoning as the api: timeout above.
  reboot_timeout: "15min"

sensor:
  - platform: uptime
    name: Uptime
  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"
  - platform: copy # Reports the WiFi signal strength in %
    source_id: wifi_signal_db
    name: "WiFi Signal Percent"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "Signal %"
    entity_category: "diagnostic"
    device_class: ""
  - platform: internal_temperature
    name: "esp32_internal_temperature"
  - platform: as3935
    distance:
      name: "Lightning Distance"
    lightning_energy:
      name: "Lightning Energy"

button:
  - platform: restart
    name: "Reboot ESP"

# ---- SPI bus ------------------------------------------------
# NOT the ESP32's default VSPI pins (18/19/23), on purpose. On the rev 2
# main board each series resistor is soldered pin to pin between an ESP32
# pin and the RJ45 header pin directly below it, and neither pin order can
# move, so these GPIOs were chosen to line up with the jack (README 7.1,
# as3935-protoboard-layout.pdf page 3). The ESP32 routes SPI to any pin
# through its GPIO matrix; at these speeds that costs nothing.
# Do not "fix" these back to the defaults -- the board will stop matching.
# (The rev 1 breadboard used the defaults; this config no longer fits it.)
spi:
  clk_pin: GPIO19
  miso_pin: GPIO5     # a strapping pin, but only for SDIO-slave timing
  mosi_pin: GPIO18

# ---- AS3935 over SPI ----------------------------------------
as3935_spi:
  cs_pin: GPIO16
  irq_pin: GPIO4

  # SPI clock for this device. ESPHome defaults to 1 MHz. The traffic is a
  # handful of single-byte register reads per event, so 200 kHz costs
  # nothing -- and it means the ESP32 samples each bit 2.5 us after an edge
  # whose ringing on 3 m of Cat5 has settled within ~100 ns. It does NOT
  # stop the ringing itself; that is what the 68 ohm series terminators on
  # the main board are for (README 7.1).
  data_rate: 200kHz

  # >>> REQUIRED. Without this, nothing is ever detected. <<<
  # The AS3935 is a MODE1 SPI part (CPOL=0, CPHA=1) -- SparkFun's library,
  # which ESPHome's component was ported from, uses SPI_MODE1. But
  # as3935_spi.h declares CLOCK_POLARITY_LOW + CLOCK_PHASE_LEADING, which
  # is MODE0, and nothing overrides it unless you set spi_mode here.
  #
  # In MODE0 the ESP32 samples MISO on the rising edge -- the same edge the
  # AS3935 changes it on -- so every byte reads back shifted right one bit.
  # The symptom is unmistakable: the interrupt register reads 2, which is
  # not a valid AS3935 interrupt code, and loop() silently falls through
  # because it only matches 1 (noise) / 4 (disturber) / 8 (lightning).
  # 2 is disturber (4) shifted; lightning (8) would read as 4 and be
  # reported as a disturber. See ESPHome issue #10455.
  spi_mode: MODE1

  # >>> This is the TUN_CAP register value: 8 pF STEPS, not pF. <<<
  # Take the pF value printed on the board label and DIVIDE BY 8.
  # Valid range is 0-15 (i.e. 0-120 pF); entering pF directly fails
  # validation with "must be between 0 and 15".
  # This board's label reads 72 pF  ->  72 / 8 = 9.
  capacitance: 9

  # true  = indoor AFE gain (use while bench testing indoors)
  # false = outdoor AFE gain (use once mounted outside/attic)
  indoor: true             # <-- flip to false for deployment

  # Noise / disturber handling -- start here, adjust if needed
  #
  # Direction matters, and ESPHome's log message ("try increasing the spike
  # rejection value") is the OPPOSITE of what you want when a REAL event is
  # being misclassified as a disturber:
  #   RAISE  these to reject more disturbers (quieter, less sensitive)
  #   LOWER  these to accept more events as lightning (what bench testing needs)
  # The AS3935 calls an event a disturber when its waveform does not match the
  # chip's lightning model; spike_rejection governs how strict that match is.
  # Measured on the bench 2026-08-09: 25 disturber interrupts in ~150 s with
  # the emulator UNPLUGGED -- about one every 6 s from ambient EMI alone.
  # Since each disturber deactivates the AFE for ~1.5 s, the sensor was deaf
  # roughly a quarter of the time. Fix the environment before loosening these:
  # lowering spike_rejection in a noisy spot converts ambient disturbers into
  # false LIGHTNING reports, which is worse than the symptom it cures.
  noise_level: 2           # 1-7,  raise if noise-floor trips
  # Left at 2 deliberately. WDTH only gates whether a signal is strong enough
  # to ENTER validation, and the emulator already clears it (12/15 bursts
  # produced an interrupt). Lowering it cannot reclassify an event that is
  # already being detected -- it would only admit more ambient noise.
  watchdog_threshold: 2    # 1-10, lower = more signals enter validation
  # THIS is the lever for disturber-vs-lightning. SREJ sets how strictly the
  # waveform must match the chip's lightning model; the emulator is clearing
  # the watchdog and then failing this match. Lowered 2 -> 1 for bench work.
  # Note ESPHome cannot reach SREJ=0 (write_spike_rejection() drops <1),
  # though the datasheet and SparkFun's library allow it.
  spike_rejection: 1       # 1-11, lower = more events accepted as lightning
  lightning_threshold: 1   # 1/5/9/16 strikes before IRQ -- keep 1
  mask_disturber: false    # set true in production to hush disturbers
  # 0/16/32/64/128. The schema default is 0, which writes NOTHING and
  # leaves the chip's power-on /16; setting 16 writes /16 explicitly.
  div_ratio: 16

  # Antenna verification only. Set true ONCE to confirm the
  # written capacitance/frequency in the log, then set back to
  # false -- detection is DISABLED while tune_antenna is true.
  tune_antenna: false

  # RCO (oscillator) calibration at startup. Default is true and it
  # should stay true; tune_antenna already takes precedence over it
  # in setup(), so there is no need to disable this by hand.
  calibration: true

binary_sensor:
  - platform: as3935
    name: "Storm Alert"
