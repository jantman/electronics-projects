# =============================================================
#  AS3935 Lightning Detector
#  Playing With Fusion SEN-39003  +  ESP32  (SPI, IRQ-driven)
# =============================================================
# Per-strike reporting: each IRQ fires the "Storm Alert" binary
# sensor and updates the distance + energy sensors immediately.
#
# Wiring (SEN-39003 -> ESP32):
#   VDD  -> 3V3     (power at 3.3 V, NOT 5 V, to match logic levels)
#   GND  -> GND
#   SCLK -> GPIO18
#   MISO -> GPIO19
#   MOSI -> GPIO23
#   CS   -> GPIO5
#   IRQ  -> GPIO4
#   SI   -> GND     (GND selects SPI; VDD would select I2C)
# =============================================================

esphome:
  name: lightning-detector
  friendly_name: Lightning Detector

esp32:
  board: esp32dev
  framework:
    type: arduino

# Bump to VERY_VERBOSE while tuning/testing so you can see the
# capacitance value and disturber/noise interrupts in the log.
logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Optional local dashboard served by the node itself
web_server:
  port: 80

# ---- SPI bus (ESP32 default VSPI pins) ----------------------
spi:
  clk_pin: GPIO18
  miso_pin: GPIO19
  mosi_pin: GPIO23

# ---- AS3935 over SPI ----------------------------------------
as3935_spi:
  cs_pin: GPIO5
  irq_pin: GPIO4

  # >>> SET THIS to the pF value printed on your board's label. <<<
  # The AS3935 internal tuning caps step in 8 pF increments
  # (0-120), so round to the nearest multiple of 8 if needed.
  capacitance: 96          # <-- REPLACE with YOUR board's value

  # true  = indoor AFE gain (use while bench testing indoors)
  # false = outdoor AFE gain (use once mounted outside/attic)
  indoor: true             # <-- flip to false for deployment

  # Noise / disturber handling -- start here, adjust if needed
  noise_level: 2           # 0-7,  raise if noise-floor trips
  watchdog_threshold: 2    # 0-10, raise to reject more disturbers
  spike_rejection: 2       # 0-11, raise to reject more disturbers
  lightning_threshold: 1   # 1/5/9/16 strikes before IRQ -- keep 1
  mask_disturber: false    # set true in production to hush disturbers
  div_ratio: 16            # leave default

  # Antenna verification only. Set true ONCE to confirm the
  # written capacitance/frequency in the log, then set back to
  # false -- detection is DISABLED while tune_antenna is true.
  tune_antenna: false
  calibration: false

sensor:
  - platform: as3935
    distance:
      name: "Lightning Distance"
    lightning_energy:
      name: "Lightning Energy"

binary_sensor:
  - platform: as3935
    name: "Storm Alert"
